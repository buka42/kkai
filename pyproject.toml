[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kkai"
version = "0.1.0"
description = "Kraków–Kazimierz AI: generation, blinded coding and analysis of generated images"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "openai>=2.0",
  "google-genai>=1.40",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
stats = ["krippendorff>=0.6", "statsmodels>=0.14", "scipy>=1.11", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
kkai = "kkai.cli:main"

[tool.setuptools]
packages = ["kkai", "kkai.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
